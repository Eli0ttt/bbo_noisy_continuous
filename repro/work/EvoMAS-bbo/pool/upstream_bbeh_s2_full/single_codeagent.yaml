name: single_codeagent_BBEH
description: Single CodeAgent for BBEH
backend: smolagents
agents:
  worker:
    id: worker
    role: worker
    agent_type: CodeAgent
    model_id: openai:deepseek-v4-flash-s2
    prompt: worker
    tools: []
    max_tokens: 8192
    temperature: 0.7
    device: null
topology:
  reports_to: {}
execution:
  parallel_workers: false
  timeout: 900
  max_retries: 0
