name: majority_vote_bbeh
description: Majority voting system with 6 CodeAgents for BBEH benchmark tasks
backend: smolagents
agents:
  worker1:
    id: worker1
    role: worker
    agent_type: CodeAgent
    model_id: openai:deepseek-v4-flash-s2
    prompt: worker
    tools:
    - bbo_read_context
    max_tokens: 4096
    temperature: 0.7
    device: null
  worker2:
    id: worker2
    role: worker
    agent_type: CodeAgent
    model_id: openai:deepseek-v4-flash-s2
    prompt: worker
    tools:
    - bbo_read_context
    max_tokens: 4096
    temperature: 0.7
    device: null
  worker3:
    id: worker3
    role: worker
    agent_type: CodeAgent
    model_id: openai:deepseek-v4-flash-s2
    prompt: worker
    tools:
    - bbo_read_context
    max_tokens: 4096
    temperature: 0.7
    device: null
  worker4:
    id: worker4
    role: worker
    agent_type: CodeAgent
    model_id: openai:deepseek-v4-flash-s2
    prompt: worker
    tools:
    - bbo_read_context
    max_tokens: 4096
    temperature: 0.7
    device: null
  worker5:
    id: worker5
    role: worker
    agent_type: CodeAgent
    model_id: openai:deepseek-v4-flash-s2
    prompt: worker
    tools:
    - bbo_read_context
    max_tokens: 4096
    temperature: 0.7
    device: null
  worker6:
    id: worker6
    role: worker
    agent_type: CodeAgent
    model_id: openai:deepseek-v4-flash-s2
    prompt: worker
    tools:
    - bbo_read_context
    max_tokens: 4096
    temperature: 0.7
    device: null
  aggregator:
    id: aggregator
    role: aggregator
    agent_type: CodeAgent
    model_id: openai:deepseek-v4-flash-s2
    prompt: aggregator
    tools:
    - bbo_read_context
    - bbo_write_candidate
    - bbo_preflight_candidate
    max_tokens: 4096
    temperature: 0.7
    device: null
topology:
  reports_to:
    worker1:
    - aggregator
    worker2:
    - aggregator
    worker3:
    - aggregator
    worker4:
    - aggregator
    worker5:
    - aggregator
    worker6:
    - aggregator
execution:
  parallel_workers: true
  timeout: 600
  max_retries: 0
