name: croto_bbeh
description: DAG-unrolled CROTO (multi-phase teams with hierarchical aggregation)
  for BBEH tasks
backend: smolagents
agents:
  team1_p1:
    id: team1_p1
    role: team_worker
    agent_type: CodeAgent
    model_id: openai:deepseek-v4-flash-s2
    prompt: team_worker
    tools:
    - bbo_read_context
    max_tokens: 4096
    temperature: 0.2
    device: null
    metadata: &id001
      team_id: 1
  team2_p1:
    id: team2_p1
    role: team_worker
    agent_type: CodeAgent
    model_id: openai:deepseek-v4-flash-s2
    prompt: team_worker
    tools:
    - bbo_read_context
    max_tokens: 4096
    temperature: 0.2
    device: null
    metadata: &id002
      team_id: 2
  team3_p1:
    id: team3_p1
    role: team_worker
    agent_type: CodeAgent
    model_id: openai:deepseek-v4-flash-s2
    prompt: team_worker
    tools:
    - bbo_read_context
    max_tokens: 4096
    temperature: 0.4
    device: null
    metadata: &id003
      team_id: 3
  team4_p1:
    id: team4_p1
    role: team_worker
    agent_type: CodeAgent
    model_id: openai:deepseek-v4-flash-s2
    prompt: team_worker
    tools:
    - bbo_read_context
    max_tokens: 4096
    temperature: 0.4
    device: null
    metadata: &id004
      team_id: 4
  agg_p1_r1_g1:
    id: agg_p1_r1_g1
    role: aggregator
    agent_type: CodeAgent
    model_id: openai:deepseek-v4-flash-s2
    prompt: aggregator_croto
    tools:
    - bbo_read_context
    max_tokens: 4096
    temperature: 0.7
    device: null
  agg_p1_r1_g2:
    id: agg_p1_r1_g2
    role: aggregator
    agent_type: CodeAgent
    model_id: openai:deepseek-v4-flash-s2
    prompt: aggregator_croto
    tools:
    - bbo_read_context
    max_tokens: 4096
    temperature: 0.7
    device: null
  agg_p1_r2_g1:
    id: agg_p1_r2_g1
    role: aggregator
    agent_type: CodeAgent
    model_id: openai:deepseek-v4-flash-s2
    prompt: aggregator_croto
    tools:
    - bbo_read_context
    max_tokens: 4096
    temperature: 0.7
    device: null
  team1_p2:
    id: team1_p2
    role: team_worker
    agent_type: CodeAgent
    model_id: openai:deepseek-v4-flash-s2
    prompt: team_worker
    tools:
    - bbo_read_context
    max_tokens: 4096
    temperature: 0.2
    device: null
    metadata: *id001
  team2_p2:
    id: team2_p2
    role: team_worker
    agent_type: CodeAgent
    model_id: openai:deepseek-v4-flash-s2
    prompt: team_worker
    tools:
    - bbo_read_context
    max_tokens: 4096
    temperature: 0.2
    device: null
    metadata: *id002
  team3_p2:
    id: team3_p2
    role: team_worker
    agent_type: CodeAgent
    model_id: openai:deepseek-v4-flash-s2
    prompt: team_worker
    tools:
    - bbo_read_context
    max_tokens: 4096
    temperature: 0.4
    device: null
    metadata: *id003
  team4_p2:
    id: team4_p2
    role: team_worker
    agent_type: CodeAgent
    model_id: openai:deepseek-v4-flash-s2
    prompt: team_worker
    tools:
    - bbo_read_context
    max_tokens: 4096
    temperature: 0.4
    device: null
    metadata: *id004
  agg_p2_r1_g1:
    id: agg_p2_r1_g1
    role: aggregator
    agent_type: CodeAgent
    model_id: openai:deepseek-v4-flash-s2
    prompt: aggregator_croto
    tools:
    - bbo_read_context
    max_tokens: 4096
    temperature: 0.7
    device: null
  agg_p2_r1_g2:
    id: agg_p2_r1_g2
    role: aggregator
    agent_type: CodeAgent
    model_id: openai:deepseek-v4-flash-s2
    prompt: aggregator_croto
    tools:
    - bbo_read_context
    max_tokens: 4096
    temperature: 0.7
    device: null
  agg_p2_r2_g1:
    id: agg_p2_r2_g1
    role: aggregator
    agent_type: CodeAgent
    model_id: openai:deepseek-v4-flash-s2
    prompt: aggregator_croto
    tools:
    - bbo_read_context
    - bbo_write_candidate
    - bbo_preflight_candidate
    max_tokens: 4096
    temperature: 0.7
    device: null
topology:
  reports_to:
    team1_p1:
    - agg_p1_r1_g1
    team2_p1:
    - agg_p1_r1_g1
    team3_p1:
    - agg_p1_r1_g2
    team4_p1:
    - agg_p1_r1_g2
    agg_p1_r1_g1:
    - agg_p1_r2_g1
    agg_p1_r1_g2:
    - agg_p1_r2_g1
    agg_p1_r2_g1:
    - team1_p2
    - team2_p2
    - team3_p2
    - team4_p2
    team1_p2:
    - agg_p2_r1_g1
    team2_p2:
    - agg_p2_r1_g1
    team3_p2:
    - agg_p2_r1_g2
    team4_p2:
    - agg_p2_r1_g2
    agg_p2_r1_g1:
    - agg_p2_r2_g1
    agg_p2_r1_g2:
    - agg_p2_r2_g1
execution:
  parallel_workers: true
  timeout: 900
  max_retries: 0
