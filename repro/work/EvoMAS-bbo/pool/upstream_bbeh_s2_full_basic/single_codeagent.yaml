name: single_codeagent_BBEH
description: Single CodeAgent for BBEH
backend: smolagents
agents:
  worker:
    id: worker
    role: worker
    agent_type: CodeAgent
    model_id: openai:deepseek-v4-flash-s2
    prompt: worker
    tools:
    - bbo_read_context
    - bbo_read_public_data
    - bbo_read_prior_feedback
    - bbo_read_prior_trace
    - bbo_write_candidate
    - bbo_preflight_candidate
    - bbo_probe_candidate
    max_tokens: 8192
    temperature: 0.7
    device: null
topology:
  reports_to: {}
execution:
  parallel_workers: false
  timeout: 900
  max_retries: 0
