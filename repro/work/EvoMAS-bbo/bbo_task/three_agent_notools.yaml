name: single_codeagent_BBEH
description: Multi-agent system for designing a noise-aware continuous black-box optimizer
  for 10-dimensional smooth periodic multimodal objectives with 120-query budget and
  strict runtime constraints
backend: smolagents
agents:
  designer:
    id: designer
    role: worker
    agent_type: CodeAgent
    model_id: openai:deepseek-v4-flash-s1
    prompt: optimizer_designer
    tools: []
    max_tokens: 8192
    temperature: 0.7
    device: null
  implementer:
    id: implementer
    role: worker
    agent_type: CodeAgent
    model_id: openai:deepseek-v4-flash-s1
    prompt: code_implementer
    tools: []
    max_tokens: 8192
    temperature: 0.7
    device: null
  aggregator:
    id: aggregator
    role: aggregator
    agent_type: CodeAgent
    model_id: openai:deepseek-v4-flash-s1
    prompt: aggregator
    tools: []
    max_tokens: 8192
    temperature: 0.7
    device: null
topology:
  reports_to:
    designer:
    - aggregator
    implementer:
    - aggregator
    aggregator: []
execution:
  parallel_workers: true
  timeout: 900
  max_retries: 1
