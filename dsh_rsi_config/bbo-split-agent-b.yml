- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      split-agent-b:
        displayName: Split Agent B
        apiKeyEnv: AGENT_B_API_KEY
        api: openai-completions
        baseURL: !!js process.env.AGENT_B_BASE_URL
        models:
          - id: !!js process.env.AGENT_B_MODEL
            name: Split Agent B model
            contextWindow: 131072
            maxTokens: 16384
            reasoningEfforts: false
            compat:
              maxTokensField: max_tokens
- id: agent-default-model
  config:
    provider: split-agent-b
    model: !!js process.env.AGENT_B_MODEL
